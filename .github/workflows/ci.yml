name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polybot
          POSTGRES_PASSWORD: polybot
          POSTGRES_DB: polybot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polybot" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POLYBOT_TEST_DATABASE_URL: postgresql+asyncpg://polybot:polybot@localhost:5432/polybot_test
      POLYBOT_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests migrations && uv run ruff format --check src tests migrations
      - name: mypy (strict)
        run: uv run mypy
      - name: tests (unit + integration on fixtures, no secrets)
        run: uv run pytest -q
      - name: migrations are in sync with models
        run: POLYBOT_DATABASE_URL=$POLYBOT_TEST_DATABASE_URL uv run alembic upgrade head && POLYBOT_DATABASE_URL=$POLYBOT_TEST_DATABASE_URL uv run alembic check
      - name: offline demo smoke
        run: uv run polybot demo > demo.txt && grep -q "SIGNAL" demo.txt

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
