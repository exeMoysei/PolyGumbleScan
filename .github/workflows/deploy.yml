name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA of an image already built by ci (defaults to the selected ref)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: deploy over ssh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --quiet origin && git checkout --quiet "${{ inputs.sha || github.sha }}"
            ./ops/deploy.sh "${{ inputs.sha || github.sha }}"
