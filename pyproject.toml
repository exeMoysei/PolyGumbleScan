[project]
name = "polybot"
version = "0.1.0"
description = "PolyBot — cross-venue sports arbitrage scanner (prediction markets ↔ sportsbooks) with Telegram delivery"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "aiogram>=3.13",
    "prometheus-client>=0.20",
    "rapidfuzz>=3.9",
]

[project.scripts]
polybot = "polybot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "fakeredis>=2.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL and Redis (POLYBOT_TEST_DATABASE_URL / POLYBOT_TEST_REDIS_URL)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ", "B011"]
"src/polybot/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["polybot"]
plugins = ["pydantic.mypy"]
